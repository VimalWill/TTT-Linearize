# Stage 2 -- autoregressive finetune on the LM loss.
# Resumes from the stage-1 checkpoint: LoRA on q/k/v plus the TTT branch.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 200
  num_val_docs: 20
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # stage 1's output: run.py writes to checkpoints/<cfg-basename>/best
  pretrained_model_name_or_path: 'checkpoints/ttt_at/best'
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_use_momentum: True
  ttt_use_muon: False
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 2
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
