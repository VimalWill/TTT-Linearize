# Auto-derived from ttt_ar_unified_longalpaca.yml: identical except for the
# passkey mixture. Inits from the CLEAN anchor stage 1 (ttt_at_anchor_gate),
# NOT from a passkey stage 1. Two reasons:
#   1. Stage 1 cannot teach retrieval. A passkey example there contributes MSE
#      over all 8192 positions (matching attention on repetitive filler) and CE
#      on ~5 answer tokens, with mse_factor 1000 making MSE dominant and no
#      LoRA to adapt q/k/v. Measured cost of mixing it into stage 1 anyway:
#      CE 4.99 at step 250 against the clean run's ~2.85 (Fig. 1).
#   2. Sharing stage 1 with the anchor arm makes this a controlled comparison,
#      so any recall change is attributable to the passkey data alone.
# Matches Lizard (arXiv 2507.09025) and Glide, which both put passkey in an AR
# stage rather than in attention transfer.
# Stage 2 (AR finetune) on LongAlpaca -- must mirror ttt_at_anchor_gate.yml.
data:
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 200
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
  # Passkey retrieval. The ONE part of the corpus that requires storing an
  # arbitrary token instead of its gist. Measured on anchor_v2: ablating all 32
  # TTT memories moved RULER niah_single by +0.006/-0.002/+0.010 (stderr ~0.02),
  # so the whole 25% score was the 512-token window, 512/2048. SWDE over the
  # same contexts moves +22.78, so the memory is not inert -- it holds gist and
  # drops identity, and nothing in LongAlpaca ever asks for identity.
  # Count matches Lizard (arXiv 2507.09025), which reaches perfect passkey
  # retrieval on 10k examples at a comparable token budget. That is 38% of the
  # 26k-sample mixture; at max_steps x batch_size samples actually drawn, raise
  # max_steps rather than the share if exposure turns out short.
  passkey_mix_path: "nanotron/llama3-16k-passkey-retrieval-finetuning"
  passkey_mix_docs: 10000
  passkey_max_tokens: 8128    # max_length 8192 less BOS/EOS headroom
model:
  name: 'ttt_ar'
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_anchor_gate/best_ckpt}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_layer_indices: null  # all layers, including when loading a restricted config
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  ttt_gate: 'sigmoid'            # MUST match stage 1 (ttt_at_anchor_gate). A
                                 # sigmoid-trained gate goes negative, and
                                 # silu(negative) is negative while sigmoid(negative)
                                 # is positive -- a mismatch flips the sign of the
                                 # whole TTT contribution.
  ttt_scale_init_bias: -3.0      # unused (gate loads trained), but the validator
                                 # rejects sigmoid above -1.0, so it will not build.
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 1
  max_steps: 400   # ~26M tokens, matching lolcats_ar. 200 was 13.1M, about 2x short,
                   # and stage 2 was still falling -0.052/100 when it hit that wall.
                   # The LR also decays to 0 across exactly these steps.
  max_grad_norm: 1.0
  gradient_checkpointing: True
  eval_steps: 100
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
