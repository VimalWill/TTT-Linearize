# Stage 2 -- autoregressive finetune on LongAlpaca, SWA + TTT at every layer.
# Matches Configs/ttt_at_unified.yml: two shared anchor memories with writers
# L0/L28 and mapped readers L1/L29-L31; private memories at L2-L27.
# Total: 28 independent memories and four learnable reader maps.
#
# LongAlpaca-12k holds ~12,000 samples, so num_train_docs caps out there.
# Documents are instruction/answer pairs, every token supervised (the Alpaca
# prompt template is deliberately not used -- it masks the instruction to -100
# and ConcatDataset then drops packed chunks that are all prompt).
data:
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 200
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # Load stage 1 for this topology. TTT_INIT optionally overrides that path.
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_unified/best_ckpt}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  # --- must mirror Configs/ttt_at_unified.yml ---
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_layer_indices: null  # all layers, including when loading a restricted config
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  # ~12k docs at ~9k tokens pack to ~13k sequences of 8192, i.e. ~1650 gradient
  # steps per epoch against PG19's 313. One epoch is already 5x that budget.
  epochs: 1
  max_grad_norm: 1.0
  gradient_checkpointing: True
  eval_steps: 100
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
