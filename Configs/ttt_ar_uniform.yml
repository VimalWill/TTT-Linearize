# Stage 2 -- autoregressive finetune, uniform allocation.
#
# UNIFORM BASELINE: the same budget spread evenly, which is what Based
# (arXiv:2402.18668) does when it dials state size along its recall-throughput
# frontier. Non-uniform allocation is only a contribution if it beats this.
#
# All three arms in this family hold the SAME total fast-weight state:
#   sum(ttt_inter_multi) = 11.875  ->  74.7 MB fp32, vs 201.3 MB at r=1.0
# so any difference between them is allocation, not budget.
#   measured  L0-1 + L25-31 at r=1.0,   L2-24 at r=0.125   (d_h 128 / 16)
#   inverted  L0-1 + L25-31 at r=0.125,  L2-24 at r=0.4674  (d_h 16 / 59)
#   uniform   all layers at r=0.3711                        (d_h 47)
#
# ttt_head_dim stays 128 in every arm, so the feature map and the l2_norm
# geometry are untouched and only capacity varies. See diag_retrieval.py and
# diag_mmlu.py for the measurements, and LinearizeLlama.py for the per-layer
# ttt_inter_multi plumbing.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 200
  num_val_docs: 20
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # stage 1's output. `best_ckpt` is written on every eval improvement
  # (trainer.py), while `best` is only written after the training loop finishes
  # (train.py) -- so `best` is absent if stage 1 was interrupted. They hold the
  # same weights, since `best` is `best_ckpt` reloaded and re-saved, so point at
  # `best_ckpt`: it exists either way.
  pretrained_model_name_or_path: ${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_uniform/best_ckpt
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  # --- must mirror Configs/ttt_at_l2.yml ---
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_inter_multi: [0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094, 0.371094]
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 2
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
