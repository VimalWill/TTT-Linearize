# Smoke test -- same code path as ttt_at_l2.yml, small enough to fail fast.
# Exercises the l2 objective + retention gate on 4 docs before the real run.
# Per-layer regression of the hybrid output onto full softmax attention computed
# from the same q/k/v. No LM loss, no LoRA: the pretrained projections are the
# teacher and must not move. This exists because the TTT fast weights have no
# counterpart in the checkpoint, so they cannot be warm-started the way Liger
# warm-starts a GLA gate from pretrained K.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 4
  num_val_docs: 2
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: 'meta-llama/Llama-3.1-8B'
  max_length: 2048
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  # With Muon the equilibrium is ||W||_eq ~ lr*sqrt(d)/(1-alpha), so holding
  # ||W|| near ||W_0|| means lr ~ (1-alpha)*fw_init_gain = 0.018*1.0. See
  # Configs/ttt_at_l2.yml for the full calibration log.
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: {"": 0}
train:
  optim: 'adamw_torch'
  lr: 0.0002
  epochs: 1
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # 4 docs @ 2048 with batch_size 8 is only ~25 grad steps, and eval_steps
  # defaults to 200 -- without this the smoke run evaluates once at step 0 and
  # never again, so it proves nothing beyond "did not crash".
  eval_steps: 5
  save_steps: 100000
  metric_for_best_model: 'eval/loss_ce'
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
