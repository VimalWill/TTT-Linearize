# Continue the trained Llama arm; use its full/base checkpoint AND stage-2 adapter.
data:
  name: long_context
  path: ${oc.env:LONG_CONTEXT_DATA}
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
  initial_max_length: 8192
  seed: 2026
model:
  name: ttt_ar
  pretrained_model_name_or_path: ${oc.env:TTT_INIT}
  max_length: 16384
  attn_varient: ttt
  lact_chunk_size: 512
  window_size: 512
  ttt_inner_loss: l2
  # The inner loop diverges without these. They are not cosmetic defaults:
  # ttt_use_muon defaults to False (LinearizeLlama.py:246), fw_init_gain to 0.5
  # (:283) and ttt_base_lr to 1e-2 (:341), and an l2 inner loss REQUIRES Muon --
  # its Newton-Schulz step is what bounds each update's spectral norm. Without
  # it the fast weights grow geometrically per chunk: measured finite at one
  # inner update, non-finite in 6 layers at three (seq 2048) and in 31 of 32 at
  # 8192, which renders generation as '!!!!!!' and every retrieval score zero.
  # These values match Configs/ttt_ar_unified_longalpaca.yml, whose checkpoint
  # stays finite to 8192 under the same test.
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  ttt_gate: sigmoid
  ttt_scale_init_bias: -3.0
  ttt_layer_indices: null
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  use_cache: false
  add_eos_token: false
  device_map: auto
train:
  continue_adapter: ${oc.env:TTT_ADAPTER,null}
  optim: adamw_torch
  lr_scheduler: token_linear
  lr: 0.0001
  min_lr: 0.00001
  warmup_tokens: 3000000
  max_input_tokens: 100000000
  phase_transition_tokens: 20000000
  final_max_length: 16384
  max_steps: -1
  epochs: 10
  max_grad_norm: 1.0
  gradient_checkpointing: true
  generation_validation: true
  validation_per_cell: 4
  validation_max_new_tokens: 256
  metric_for_best_model: eval/retrieval_accuracy
  greater_is_better: true
  eval_steps: 100
  save_steps: 100000
  fail_on_backward_error: true
  fail_on_nonfinite: true
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: true
  train_qk_lora: true
  train_v: true
  train_v_lora: true
