# Continue the trained Llama arm; use its full/base checkpoint AND stage-2 adapter.
data:
  name: long_context
  path: ${oc.env:LONG_CONTEXT_DATA}
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
  initial_max_length: 8192
  seed: 2026
model:
  name: ttt_ar
  pretrained_model_name_or_path: ${oc.env:TTT_INIT}
  max_length: 16384
  attn_varient: ttt
  lact_chunk_size: 512
  window_size: 512
  ttt_inner_loss: l2
  # The inner loop diverges without these. They are not cosmetic defaults:
  # ttt_use_muon defaults to False (LinearizeLlama.py:246), fw_init_gain to 0.5
  # (:283) and ttt_base_lr to 1e-2 (:341), and an l2 inner loss REQUIRES Muon --
  # its Newton-Schulz step is what bounds each update's spectral norm. Without
  # it the fast weights grow geometrically per chunk: measured finite at one
  # inner update, non-finite in 6 layers at three (seq 2048) and in 31 of 32 at
  # 8192, which renders generation as '!!!!!!' and every retrieval score zero.
  # These values match Configs/ttt_ar_unified_longalpaca.yml, whose checkpoint
  # stays finite to 8192 under the same test.
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  ttt_gate: sigmoid
  ttt_scale_init_bias: -3.0
  ttt_layer_indices: null
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  use_cache: false
  add_eos_token: false
  device_map: auto
train:
  continue_adapter: ${oc.env:TTT_ADAPTER,null}
  optim: adamw_torch
  lr_scheduler: token_linear
  lr: 0.0001
  min_lr: 0.00001
  warmup_tokens: 3000000
  max_input_tokens: 100000000
  phase_transition_tokens: 20000000
  final_max_length: 16384
  max_steps: -1
  epochs: 10
  max_grad_norm: 1.0
  gradient_checkpointing: true
  generation_validation: true
  # 16, not 4. At n=4 a cell that is truly 20% correct shows 0/4 about 41% of
  # the time, so the twelve all-zero cells of the first run could not be told
  # apart from "not learned yet" -- which is exactly the question the run
  # exists to answer.
  validation_per_cell: 16
  # 128, not 256. Generation stops on EOS, so this cap only binds on collapsed
  # decodes -- and those ran the full budget in the previous run. At 16 per
  # cell that is 224 generations per eval; measured decode is ~34 ms/step, so
  # 256 costs ~33 min per eval and roughly 5 of the run's 10 hours. The
  # longest answer is an aggregation list of ~8 labels, about 80 tokens, so
  # 128 leaves headroom while halving the worst case.
  validation_max_new_tokens: 128
  # NOT retrieval_accuracy. That scorer demands the generation equal the answer
  # exactly after whitespace folding, over 256 greedy tokens with no stop, so
  # it stayed 0.000 for the whole previous run. best_val_metric starts at -inf
  # and improvement is strict, so step 0 saved and nothing ever beat it: the
  # "best" checkpoint was the untrained model. Substring recall moves.
  metric_for_best_model: eval/retrieval_substring_recall
  greater_is_better: true
  eval_steps: 100
  save_steps: 100000
  fail_on_backward_error: true
  fail_on_nonfinite: true
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: true
  train_qk_lora: true
  train_v: true
  train_v_lora: true
