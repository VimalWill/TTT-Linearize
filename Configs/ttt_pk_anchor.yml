# STAGE 3 (LONG-CONTEXT ARM) -- teach retrieval at 2K on top of the trained
# anchor. There is no passkey stage 1: the mechanism for long context already
# exists, what is missing is learning to retain and retrieve. So this resumes
# the finished anchor (stage-1 base + merged stage-2 adapter) and trains a
# fresh LoRA on passkey alone.
#
# Why this shape:
#   - Starting from the trained anchor keeps general ability and makes the
#     before/after an exact one-variable comparison against Table 1.
#   - 2048, not 8192. Retrieval is the lesson; length extrapolation is a
#     separate question tested WITHOUT further training at 4K/8K. Passkey
#     training teaches retention, it does not guarantee extrapolation.
#   - window_size stays 512. At 2048 that leaves 1536 tokens the local branch
#     cannot see, so any needle below depth 75% is memory-only. That is the
#     cell the step-2 eval reads.
#   - lact_chunk_size 512 -> 4 inner-loop updates per sequence.
#
# The motivating measurement (anchor_v2, 2026-09-28): ablating all 32 TTT
# memories moved RULER niah_single by +0.006/-0.002/+0.010 against stderr
# ~0.02, so the whole 25% score was the window (512/2048 = 0.250). The same
# memory moves SWDE +22.78 over a trained SWA-only arm, so it is not inert --
# it holds gist and drops token identity.
data:
  # Passkey retrieval as the WHOLE corpus -- train AND validation. This is the
  # dedicated long-context arm, separate from the anchor pipeline. Established
  # 2026-09-28 on anchor_v2: ablating all 32 TTT memories moved RULER
  # niah_single by +0.006/-0.002/+0.010 against a stderr of ~0.02, so the entire
  # 25% score was the sliding window catching needles inside it (512/2048 =
  # 0.250). The memory holds gist and drops token identity, and nothing in
  # LongAlpaca ever asks for identity.
  #
  # No mixture: eval/loss is passkey loss, so metric_for_best_model tracks the
  # thing being taught. The earlier mixture arm could not -- passkey training
  # RAISES LongAlpaca CE, so best_ckpt stuck at step 0.
  name: "passkey"
  path: "nanotron/llama3-16k-passkey-retrieval-finetuning"
  num_train_docs: 10000
  num_val_docs: 200
  passkey_max_tokens: 1984   # max_length 2048 less BOS/EOS headroom
  passkey_mask_prompt: True    # STAGE 2 SUPERVISES THE ANSWER SPAN ONLY. This
                               # is where retrieval is taught; loss on filler
                               # would put ~99.9% of it on "The grass is green."
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # stage-1 BASE of the trained anchor; the stage-2 adapter is merged via
  # train.resume_adapter below (resume_stage2 -> merge_and_unload, then a
  # fresh LoRA attaches on top).
  pretrained_model_name_or_path: ${oc.env:TTT_ANCHOR_S1,${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_anchor_gate/best_ckpt}
  max_length: 2048
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  ttt_layer_indices: null  # all layers, including when loading a restricted config
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  ttt_gate: 'sigmoid'            # MUST match stage 1 (ttt_at_anchor_gate). A
                                 # sigmoid-trained gate goes negative, and
                                 # silu(negative) is negative while sigmoid(negative)
                                 # is positive -- a mismatch flips the sign of the
                                 # whole TTT contribution.
  ttt_scale_init_bias: -3.0      # unused (gate loads trained), but the validator
                                 # rejects sigmoid above -1.0, so it will not build.
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  resume_adapter: ${oc.env:TTT_ANCHOR_S2,${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_ar_unified_longalpaca/best_ckpt}
  optim: 'adamw_torch'
  # NO explicit schedule here: Anchor-F is NOT being retrained, so its
  # checkpoint keeps the ReduceLROnPlateau default. Anchor-I must match it or
  # the Anchor-F vs Anchor-I contrast -- the headline, 12.6 MB against 201 MB
  # -- confounds the read-map fix with a schedule change. The ONLY intended
  # difference in this re-run is the fp32 ReaderOutputAlignment. The Mistral
  # arms do select linear; that cross-backbone difference is stated, not hidden.
  lr: 0.0001
  epochs: 1
  max_steps: 400   # ~26M tokens, matching lolcats_ar. 200 was 13.1M, about 2x short,
                   # and stage 2 was still falling -0.052/100 when it hit that wall.
                   # The LR also decays to 0 across exactly these steps.
  max_grad_norm: 1.0
  gradient_checkpointing: True
  eval_steps: 100
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
