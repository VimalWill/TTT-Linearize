# Stage 1 (attention transfer) -- separate per-layer memories, LongAlpaca.
# Budget matched to the anchor arm; this is the Non-Unified baseline.
data:
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 100
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
  short_mix_path: "yahma/alpaca-cleaned"   # unpacked, ~100-400 tokens each
  short_mix_docs: 4000                     # packed-only training never shows
                                           # the gate the regime it must close in
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,meta-llama/Llama-3.1-8B}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0   # sigmoid(4.0)=0.982; 0.982^16 = 0.75 retained
  ttt_gate: 'sigmoid'            # gamma in [0,1]: the branch can shut off. silu
                                 # spans (-0.2785, inf) and is non-monotonic near
                                 # zero, so "closed" is not cleanly reachable.
  ttt_scale_init_bias: -3.0      # sigmoid -> 0.047, matching the silu(0.1)=0.052
                                 # default. Required: the config validator rejects
                                 # sigmoid with a bias above -1.0.
  fw_init_gain: 1.0              # gain 2.0 diverged by chunk 2
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  # NO explicit schedule here: Anchor-F is NOT being retrained, so its
  # checkpoint keeps the ReduceLROnPlateau default. Anchor-I must match it or
  # the Anchor-F vs Anchor-I contrast -- the headline, 12.6 MB against 201 MB
  # -- confounds the read-map fix with a schedule change. The ONLY intended
  # difference in this re-run is the fp32 ReaderOutputAlignment. The Mistral
  # arms do select linear; that cross-backbone difference is stated, not hidden.
  lr: 0.0002   # NOT 0.01. The file previously said 0.01 (the lolcats_at
               # reference) but anchor_v2 was trained at 0.0002 and 0.01 was
               # measured to diverge here: MSE 30.3 -> 9.5 while CE went
               # 6.83 -> 9.51. The repo did not reproduce its own results.
  epochs: 1
  max_steps: 500   # ~26M tokens, matching lolcats_at's 2 epochs of alpaca-cleaned.
                   # 400 would be 26.2M, but the short mixture makes 23% of samples
                   # ~250 tokens rather than 8192, pulling the real total to ~20.4M.
                   # The LR also decays to 0 across exactly these steps.
  max_grad_norm: 1.0
  mse_factor: 1000
  lm_loss_weight: 1.0
  metric_for_best_model: 'eval/loss_ce'
  gradient_checkpointing: True
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
