# Smoke test -- same code path as ttt_at.yml, small enough to fail fast.
# Per-layer regression of the hybrid output onto full softmax attention computed
# from the same q/k/v. No LM loss, no LoRA: the pretrained projections are the
# teacher and must not move. This exists because the TTT fast weights have no
# counterpart in the checkpoint, so they cannot be warm-started the way Liger
# warm-starts a GLA gate from pretrained K.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 4
  num_val_docs: 2
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: 'meta-llama/Llama-3.1-8B'
  max_length: 2048
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_use_momentum: True
  ttt_use_muon: False
  add_eos_token: False
  device_map: {"": 0}
train:
  optim: 'adamw_torch'
  lr: 0.001
  epochs: 1
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # matches Configs/ttt_at_l2_smoke.yml so the two are directly comparable:
  # same context, docs, step count, eval cadence and selection metric.
  # NOTE the outer lr differs -- 1e-3 here (tuned for dot) vs 2e-4 for l2
  # (1e-3 diverged there). For a controlled read, run this one at 2e-4 too.
  eval_steps: 5
  save_steps: 100000
  metric_for_best_model: 'eval/loss_ce'
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
