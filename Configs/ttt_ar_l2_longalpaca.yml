# Stage 2 (autoregressive finetune) -- SEPARATE per-layer memories, LongAlpaca.
#
# The Non-Unified baseline for the anchor comparison. Every layer keeps its own
# TTT memory: no ttt_share_groups, no ttt_layer_indices. 32 memories, 201.3 MB
# of state against the anchor arm's 2 memories and 12.6 MB.
#
# Budget is matched to the anchor configs -- same corpus, same 12,000
# documents, same epochs -- so any difference between the two arms is
# architecture, not data or training budget. The published PG19 baseline
# (10.19 WikiText) is NOT a valid comparison for a LongAlpaca-trained anchor
# model, which is why this arm exists.
data:
  # LongAlpaca, matched to the anchor arm: same corpus, same document count,
  # same packing. Every token supervised (the Alpaca prompt template is not
  # used -- it masks the instruction to -100 and ConcatDataset then drops
  # packed chunks that are all prompt).
  name: "longalpaca"
  path: "Yukang/LongAlpaca-12k"
  num_train_docs: 12000
  num_val_docs: 100
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # stage 1's output. `best_ckpt` is written on every eval improvement
  # (trainer.py), while `best` is only written after the training loop finishes
  # (train.py) -- so `best` is absent if stage 1 was interrupted. They hold the
  # same weights, since `best` is `best_ckpt` reloaded and re-saved, so point at
  # `best_ckpt`: it exists either way.
  pretrained_model_name_or_path: ${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_l2_longalpaca/best_ckpt
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  # --- must mirror Configs/ttt_at_l2.yml ---
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 1            # matched to the anchor arm
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
