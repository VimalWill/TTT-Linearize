# Stage 2 -- autoregressive finetune on the LM loss, for the l2 memory.
# Resumes from the stage-1 checkpoint: LoRA on q/k/v plus the TTT branch.
#
# EVERY `model:` memory key below must match Configs/ttt_at_l2.yml exactly.
# build_model_config rebuilds the config from the yml, so an omitted key
# silently reverts to its dot default and runs the l2-trained fast weights under
# the wrong rule. Specifically, without ttt_inner_loss: 'l2':
#   - the update reverts to the Hebbian bias with Eq. 8's renorm
#   - retention_proj is never constructed, so stage 1's retention weights load
#     as unexpected keys and the gate disappears with no error
#   - ttt_use_muon goes False, which the l2 equilibrium requires to be stable
#   - ttt_base_lr reverts to 1e-2, ~50x the calibrated value
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 200
  num_val_docs: 20
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_ar'
  # stage 1's output. `best_ckpt` is written on every eval improvement
  # (trainer.py), while `best` is only written after the training loop finishes
  # (train.py) -- so `best` is absent if stage 1 was interrupted. They hold the
  # same weights, since `best` is `best_ckpt` reloaded and re-saved, so point at
  # `best_ckpt`: it exists either way.
  pretrained_model_name_or_path: ${oc.env:TTT_CKPT_DIR,checkpoints}/ttt_at_l2/best_ckpt
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  # --- must mirror Configs/ttt_at_l2.yml ---
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0
  fw_init_gain: 1.0
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  lr: 0.0001
  epochs: 2
  max_grad_norm: 1.0
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # set TTT_CKPT_DIR to project space; falls back to ./checkpoints
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: True
  train_qk_lora: True
  train_v: True
  train_v_lora: True
