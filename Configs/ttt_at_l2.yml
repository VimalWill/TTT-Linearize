# Stage 1 -- attention transfer, with a Titans/Atlas-style memory instead of
# LaCT's. THREE coupled changes vs ttt_at.yml, not one -- they do not work
# separately (see LinearTTT/.../ttt_l2.py):
#   ttt_inner_loss: 'l2'  -- Atlas Eq. 9 regression bias, carries the residual
#   ttt_base_lr           -- becomes a real hyperparameter only now; see below
#   retention gate        -- Atlas Eq. 32, replaces LaCT Eq. 8's renorm, so the
#                            regression target is reachable at all
#   fw_init_gain          -- the readout scale must land near ||v||: too low and
#                            dw ~ gain^2 cannot bootstrap against the decay (the
#                            memory fades out), too high and the update grows W
#                            superlinearly and the retention gate cannot hold it
# Treat this as a different memory design, not a single-variable ablation.
#
# fw_init_gain is CALIBRATED, not guessed. Measured on real PG19 features via
#   diag_inner.py --cfg <this> --ckpt meta-llama/Llama-3.1-8B
# gain 2.0 gave |f(k)|/|v| = 0.47 at chunk 0, doubled by chunk 1 and diverged to
# NaN at chunk 2. Target |f|/|v| ~ 0.05-0.2 at chunk 0 AND roughly flat across
# chunks; watch the max column too, since the worst head diverges first.
#
# Calibration log (diag_inner.py on meta-llama/Llama-3.1-8B, PG19 val):
#   gain 2.0, lr 1e-2 -> |f|/|v| 0.47 at c0, NaN at c2
#   gain 1.0, lr 1e-2 -> |f|/|v| 0.059 at c0 (in band), loss 1.050 -> 0.973
#                        across c0->c1 (first descent seen), NaN at c2
#   gain 1.0, lr 1e-4 -> pending
# Note the mean/max spread: 0.059 vs 1.77 at c0. A single lr cannot suit both,
# so if the tail is still what diverges, the next lever is normalising v for the
# l2 path (q and k are already unit-norm in _ttt_features, v is not), not a
# smaller lr -- shrinking to protect the worst head starves the rest.
# Per-layer regression of the hybrid output onto full softmax attention computed
# from the same q/k/v. No LM loss, no LoRA: the pretrained projections are the
# teacher and must not move. This exists because the TTT fast weights have no
# counterpart in the checkpoint, so they cannot be warm-started the way Liger
# warm-starts a GLA gate from pretrained K.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 200
  num_val_docs: 20
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: 'meta-llama/Llama-3.1-8B'
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  # Under LaCT, Eq. 8 rescales W back to ||W_0|| every chunk, so only the
  # update's DIRECTION survived and base_lr could not matter. With the retention
  # gate the magnitude persists, and without Muon the equilibrium is REPELLING:
  # dw ~ lr*||v||*W^2, so r = ||dw||/||W|| grows with W -- above the balance
  # point W explodes (measured r ~ 3.8 at lr 1e-2), below it the memory fades
  # (measured |f|/|v| halving over 16 chunks at lr 1e-4). No lr sits in between.
  #
  # Muon (Atlas Eq. 32) is what makes it attracting: Newton-Schulz sets ||dw||
  # from lr alone, so r ~ lr/W and the fixed point is stable. It is structurally
  # required here, not an optional extra. The equilibrium is then
  #     ||W||_eq ~ lr * sqrt(d) / (1 - alpha)
  # so holding ||W|| at ||W_0|| means  lr ~ (1 - alpha) * fw_init_gain.
  # At alpha = sigmoid(4.0) = 0.982 and gain 1.0 that is lr ~ 0.018.
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0   # sigmoid(4.0)=0.982; 0.982^16 = 0.75 retained
  fw_init_gain: 1.0              # measured: gain 2.0 gave |f|/|v|=0.47 at
                                 # chunk 0 on real PG19 features and diverged
                                 # by chunk 2; target band is 0.05-0.2
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  # the l2 update depends on w1 (cubic in W) where the dot update does not, so
  # the outer surface is stiffer; 1e-3 oscillated then diverged.
  lr: 0.0002
  epochs: 1
  max_grad_norm: 1.0
  # MSE alone lets the student and its own teacher drift together;
  # the LM term anchors stage 1 to the pretrained manifold.
  mse_factor: 1000
  lm_loss_weight: 1.0
  metric_for_best_model: 'eval/loss_ce'
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # run.py appends the config filename stem, so this stays the bare root: the
  # run lands in $TTT_CKPT_DIR/ttt_at_l2 and cannot clobber ttt_at's best_ckpt.
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
