# Stage 1 -- attention transfer, with a Titans/Atlas-style memory instead of
# LaCT's. THREE coupled changes vs ttt_at.yml, not one -- they do not work
# separately (see LinearTTT/.../ttt_l2.py):
#   ttt_inner_loss: 'l2'  -- Atlas Eq. 9 regression bias, carries the residual
#   retention gate        -- Atlas Eq. 32, replaces LaCT Eq. 8's renorm, so the
#                            regression target is reachable at all
#   fw_init_gain: 2.0     -- at 0.5 the readout sits ~1000x below ||v||, and
#                            dw ~ gain^2 is then too small to bootstrap against
#                            the decay; the memory just fades out
# Treat this as a different memory design, not a single-variable ablation.
# Per-layer regression of the hybrid output onto full softmax attention computed
# from the same q/k/v. No LM loss, no LoRA: the pretrained projections are the
# teacher and must not move. This exists because the TTT fast weights have no
# counterpart in the checkpoint, so they cannot be warm-started the way Liger
# warm-starts a GLA gate from pretrained K.
data:
  name: "pg19"
  path: "emozilla/pg19"
  num_train_docs: 200
  num_val_docs: 20
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: 'meta-llama/Llama-3.1-8B'
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  ttt_retention_init_bias: 4.0   # sigmoid(4.0)=0.982; 0.982^16 = 0.75 retained
  fw_init_gain: 2.0              # calibrate per "watch this" note below
  ttt_use_momentum: True
  ttt_use_muon: False
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  # the l2 update depends on w1 (cubic in W) where the dot update does not, so
  # the outer surface is stiffer; 1e-3 oscillated then diverged.
  lr: 0.0002
  epochs: 1
  max_grad_norm: 1.0
  # MSE alone lets the student and its own teacher drift together;
  # the LM term anchors stage 1 to the pretrained manifold.
  mse_factor: 1000
  lm_loss_weight: 1.0
  metric_for_best_model: 'eval/loss_ce'
  gradient_checkpointing: True
  # ~209 gradient steps for 200 books @ 8192, so keep these small
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  # run.py appends the config filename stem, so this stays the bare root: the
  # run lands in $TTT_CKPT_DIR/ttt_at_l2 and cannot clobber ttt_at's best_ckpt.
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
