# Continue a TRAINED anchor. TTT_INIT is its full/base checkpoint, not the
# original pretrained Llama/Mistral. TTT_ADAPTER is its stage-2 adapter, if any.
# Memory sharing, active layers, gates, and reader maps come from that checkpoint.
data:
  name: passkey
  path: nanotron/llama3-16k-passkey-retrieval-finetuning
  num_train_docs: 10000   # upper bound; the 2k/distance filter may leave fewer
  num_val_docs: 200
  passkey_min_tokens: 1024
  passkey_max_tokens: 2048  # measured with the anchor's own tokenizer
  passkey_min_distance: 768  # last key occurrence is outside the 512-token window
  passkey_mask_prompt: true
  passkey_unique_answers: true  # validation passkeys cannot occur in training
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: ttt_ar
  pretrained_model_name_or_path: ${oc.env:TTT_INIT}
  max_length: 2048
  attn_varient: ttt
  window_size: 512
  lact_chunk_size: 512
  add_eos_token: false
  device_map: auto
  use_cache: false
train:
  continue_adapter: ${oc.env:TTT_ADAPTER,null}
  optim: adamw_torch
  lr_scheduler: plateau
  lr: 0.0001
  epochs: 10  # allows repeated passes if filtering leaves a small corpus
  max_steps: 400  # optimizer-update cap; each batch contains at most 8 examples
  max_grad_norm: 1.0
  gradient_checkpointing: true
  metric_for_best_model: eval/loss_ce  # held-out passkey answer loss, not RULER
  eval_steps: 25
  save_steps: 100
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
  train_qk: true
  train_qk_lora: true
  train_v: true
  train_v_lora: true
