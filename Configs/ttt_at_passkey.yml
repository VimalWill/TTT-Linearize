# Stage 1 (LONG-CONTEXT ARM) -- attention transfer on passkey data only.
# Identical to ttt_at_anchor_gate.yml except for the corpus.
#
# RISK: the haystack filler is highly repetitive, so MSE may fall easily
# without the branch learning anything transferable. If stage-1 CE looks
# good and NIAH still does not move, init stage 2 from the general
# ttt_at_anchor_gate checkpoint instead of this one.
data:
  # Passkey retrieval as the WHOLE corpus -- train AND validation. This is the
  # dedicated long-context arm, separate from the anchor pipeline. Established
  # 2026-09-28 on anchor_v2: ablating all 32 TTT memories moved RULER
  # niah_single by +0.006/-0.002/+0.010 against a stderr of ~0.02, so the entire
  # 25% score was the sliding window catching needles inside it (512/2048 =
  # 0.250). The memory holds gist and drops token identity, and nothing in
  # LongAlpaca ever asks for identity.
  #
  # No mixture: eval/loss is passkey loss, so metric_for_best_model tracks the
  # thing being taught. The earlier mixture arm could not -- passkey training
  # RAISES LongAlpaca CE, so best_ckpt stuck at step 0.
  name: "passkey"
  path: "nanotron/llama3-16k-passkey-retrieval-finetuning"
  num_train_docs: 10000
  num_val_docs: 200
  passkey_max_tokens: 8128   # max_length 8192 less BOS/EOS headroom
  passkey_mask_prompt: False   # STAGE 1 SUPERVISES EVERY TOKEN. Attention
                               # transfer needs its CE anchor: the teacher is
                               # computed from the student's own hidden states,
                               # so MSE alone is not well-posed (measured going
                               # down 941x while CE went 6.4 -> 15.7). Masking
                               # to ~5 of 8192 tokens would leave near-pure MSE
                               # on a ~20-token repeating cycle, which a 512
                               # window reproduces alone -- the TTT branch would
                               # learn it is unnecessary and the gate would
                               # never open. Stage 2 masks.
  batch_size: 8
  micro_batch_size: 1
  val_set_size: 200
model:
  name: 'ttt_at'
  pretrained_model_name_or_path: ${oc.env:TTT_INIT,meta-llama/Llama-3.1-8B}
  max_length: 8192
  attn_varient: "ttt"
  lact_chunk_size: 512
  window_size: 512        # must be >= lact_chunk_size
  ttt_inner_loss: 'l2'
  ttt_base_lr: 0.018
  ttt_retention_init_bias: 4.0   # sigmoid(4.0)=0.982; 0.982^16 = 0.75 retained
  ttt_layer_indices: null
  ttt_share_groups: [[0, 1], [28, 29, 30, 31]]
  ttt_reader_alignment: linear
  ttt_gate: 'sigmoid'
  ttt_scale_init_bias: -3.0   # sigmoid -> 0.047, matching silu(0.1)=0.052
  fw_init_gain: 1.0              # gain 2.0 diverged by chunk 2
  ttt_use_momentum: True
  ttt_use_muon: True
  add_eos_token: False
  device_map: 'auto'
train:
  optim: 'adamw_torch'
  # NO explicit schedule here: Anchor-F is NOT being retrained, so its
  # checkpoint keeps the ReduceLROnPlateau default. Anchor-I must match it or
  # the Anchor-F vs Anchor-I contrast -- the headline, 12.6 MB against 201 MB
  # -- confounds the read-map fix with a schedule change. The ONLY intended
  # difference in this re-run is the fp32 ReaderOutputAlignment. The Mistral
  # arms do select linear; that cross-backbone difference is stated, not hidden.
  lr: 0.0002   # NOT 0.01. The file previously said 0.01 (the lolcats_at
               # reference) but anchor_v2 was trained at 0.0002 and 0.01 was
               # measured to diverge here: MSE 30.3 -> 9.5 while CE went
               # 6.83 -> 9.51. The repo did not reproduce its own results.
  epochs: 1
  max_steps: 500   # ~26M tokens, matching lolcats_at's 2 epochs of alpaca-cleaned.
                   # 400 would be 26.2M, but the short mixture makes 23% of samples
                   # ~250 tokens rather than 8192, pulling the real total to ~20.4M.
                   # The LR also decays to 0 across exactly these steps.
  max_grad_norm: 1.0
  mse_factor: 1000
  lm_loss_weight: 1.0
  metric_for_best_model: 'eval/loss_ce'
  gradient_checkpointing: True
  eval_steps: 25
  save_steps: 100000   # periodic saves off; best_ckpt is written on eval improvement
  output_dir: ${oc.env:TTT_CKPT_DIR,checkpoints}
